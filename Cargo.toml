[workspace]
members = ["crates/*", "examples"]
resolver = "3"

[workspace.package]
authors = ["Augentic"]
categories = ["wasm", "web-programming", "asynchronous"]
edition = "2024"
homepage = "https://augentic.io"
keywords = ["runtime", "wasi", "wasm", "wasmtime", "component-model"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/augentic/omnia"
rust-version = "1.97"
version = "0.36.0"

[workspace.lints.rust]
# https://dirname.github.io/rust-std-doc/rustc/lints/listing/allowed-by-default.html
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"

[workspace.lints.clippy]
# https://doc.rust-lang.org/stable/clippy/index.html
all = { level = "warn", priority = -1 }      # correctness, suspicious, style, complexity, perf
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Cherry-picked lints are from the `restriction` lint group in order to drive up
# consistency, quality, and brevity
# See https://microsoft.github.io/rust-guidelines/guidelines/universal/index.html

# allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
base64ct = { version = "1.8.3", features = ["std"] }
bon = "3.10.0"
bytes = "1.12.1"
# cap-std backs omnia's own mount registry and workspace tools (bounded
# directory handles). Since wasmtime-wasi 48 dropped cap-std from its public
# API (`Descriptor` wraps `std::fs::File`), the version is no longer coupled
# to wasmtime's.
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
cfg-if = "1.0.4"
chrono = "0.4.45"
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
clap_complete = { version = "4.6.9", default-features = false }
dashmap = "6.2.1"
fromenv = "0.1.0"
futures = "0.3.34"
futures-channel = "0.3.34"
futures-util = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = "1.11.0"
hyper-util = "0.1.20"
insta = "1.48.0"
jsonschema = { version = "0.52.0", default-features = false }
moka = { version = "0.12.16", features = ["sync"] }
opentelemetry = "0.32.0"
opentelemetry-proto = "0.32.0"
opentelemetry_sdk = "0.32.1"
parking_lot = "0.12.5"
pastey = "0.2.3"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
sea-query = { version = "1.0.2", default-features = false, features = ["thread-safe", "with-chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
syn = { version = "3.0.4", features = ["full"] }
tempfile = "3.24.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", default-features = false }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
trybuild = "1.0.120"
wasip3 = { version = "0.8.0", features = ["http-compat"] }
wasm-pkg-client = "0.16.1"
wasm-tokio = { version = "0.6.1", default-features = false }
wasmtime = { version = "48.0.1", default-features = false, features = ["anyhow", "component-model-bytes", "parallel-compilation", "pooling-allocator"] }
wasmtime-wasi = { version = "48.0.1", features = ["p3"] }
wasmtime-wasi-config = "48.0.1"
wasmtime-wasi-http = { version = "48.0.1", default-features = false, features = ["p3"] }
wasmtime-wasi-io = "48.0.1"
wit-bindgen = { version = "0.61.1", features = ["async-spawn"] }
wrpc-transport = "0.29.0"
wrpc-wasmtime = "0.1.0"

# internally referenced crates
omnia = { path = "crates/omnia", version = "0.36.0" }
omnia-cli = { path = "crates/omnia-cli", version = "0.36.0" }
omnia-core = { path = "crates/omnia-core", version = "0.36.0", default-features = false }
omnia-guest = { path = "crates/omnia-guest", version = "0.36.0" }
omnia-guest-macros = { path = "crates/guest-macros", version = "0.36.0" }
omnia-host-macros = { path = "crates/host-macros", version = "0.36.0" }
omnia-plugin = { path = "crates/omnia-plugin", version = "0.36.0" }
omnia-test = { path = "crates/omnia-test", version = "0.36.0", default-features = false }
omnia-wasi-blobstore = { path = "crates/wasi-blobstore", version = "0.36.0" }
omnia-wasi-config = { path = "crates/wasi-config", version = "0.36.0" }
omnia-wasi-docstore = { path = "crates/wasi-docstore", version = "0.36.0" }
omnia-wasi-http = { path = "crates/wasi-http", version = "0.36.0" }
omnia-wasi-identity = { path = "crates/wasi-identity", version = "0.36.0" }
omnia-wasi-keyvalue = { path = "crates/wasi-keyvalue", version = "0.36.0" }
omnia-wasi-messaging = { path = "crates/wasi-messaging", version = "0.36.0" }
omnia-wasi-model = { path = "crates/wasi-model", version = "0.36.0" }
omnia-wasi-otel = { path = "crates/wasi-otel", version = "0.36.0" }
omnia-wasi-sql = { path = "crates/wasi-sql", version = "0.36.0" }
omnia-wasi-vault = { path = "crates/wasi-vault", version = "0.36.0" }
omnia-wasi-websocket = { path = "crates/wasi-websocket", version = "0.36.0" }
test-programs = { path = "crates/test-programs" }

[patch.crates-io]
wrpc-transport = { git = "https://github.com/bytecodealliance/wrpc" }
wrpc-wasmtime = { git = "https://github.com/bytecodealliance/wrpc" }

[profile.release]
lto = true
opt-level = "s"
strip = true

# Guest components are JIT-compiled through Cranelift on every e2e test run;
# unoptimized codegen is ~10x slower and pushes the wasi-* suites toward their
# deadlines on CI runners. Only these dependencies build optimized — workspace
# code keeps full dev-profile debuggability.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

# Wasm-to-CLIF translation and trampoline generation. Crate name is
# version-coupled: wasmtime 48 renamed `wasmtime-cranelift` to this; cargo
# silently ignores the entry if a future bump renames it again.
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

