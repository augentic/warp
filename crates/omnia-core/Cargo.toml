[package]
name = "omnia-core"
description = "Runtime core of the omnia WebAssembly component runtime: deployment, registry, dispatch, and the capability-crate seam"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = ["jit", "otlp"]

# Enables just-in-time wasm to machine code compilation.
jit = ["wasmtime/cranelift"]

# Enables the OTLP (gRPC) span and metric exporters. Without it, `Telemetry`
# still installs the fmt/`EnvFilter` subscriber, while `telemetry::flush` and
# `telemetry::resource` become no-ops.
otlp = ["dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

# Enables memory protection keys (MPK) support in the pooling allocator. MPK
# only functions on Linux/x86_64; elsewhere it compiles but is inert
# (`POOL_MEMORY_PROTECTION_KEYS=auto` falls back to leaving guard regions in
# place). Off by default.
mpk = ["wasmtime/memory-protection-keys"]

# Enables the WebAssembly GC / reference-types proposal (with the default
# copying collector) and the pooling allocator's `total_gc_heaps` control
# (`POOL_TOTAL_GC_HEAPS`). Current guests compile to linear memory and never
# allocate a GC heap, so this is off by default.
gc = ["wasmtime/gc", "wasmtime/gc-copying"]

# Enables the wRPC store view and the in-process link seam (`InProcessLinks`)
# that host-mediated guest→guest linking rides. Without it, every store is
# WASI-only and a deployment's link seam is `NoLinks`. Off by default.
wrpc = ["dep:tokio-util", "dep:wasm-tokio", "dep:wrpc-transport", "dep:wrpc-wasmtime"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
bytes.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
cfg-if.workspace = true
fromenv.workspace = true
futures.workspace = true
http.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "metrics", "trace"], optional = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
pastey.workspace = true
serde.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec"], optional = true }
wasm-tokio = { workspace = true, optional = true }
wasmtime = { workspace = true, features = ["runtime"] }
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
wrpc-transport = { workspace = true, optional = true }
wrpc-wasmtime = { workspace = true, optional = true }
