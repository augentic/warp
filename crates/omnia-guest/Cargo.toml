[package]
name = "omnia-guest"
description = "Guest framework for building WASI component applications with Omnia runtime support"
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = ["orm"]

# Enables the SQL ORM (`orm`), the table/document capabilities, and the
# document-store re-exports.
orm = ["dep:omnia-wasi-docstore", "dep:omnia-wasi-sql", "dep:sea-query"]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["json"] }
bon.workspace = true
bytes.workspace = true
chrono.workspace = true
http.workspace = true
http-body.workspace = true
omnia-wasi-sql = { workspace = true, optional = true }
omnia-wasi-http.workspace = true
omnia-wasi-docstore = { workspace = true, optional = true }
sea-query = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures.workspace = true
omnia-wasi-blobstore.workspace = true
omnia-wasi-config.workspace = true
omnia-wasi-identity.workspace = true
omnia-wasi-keyvalue.workspace = true
omnia-wasi-messaging.workspace = true
omnia-wasi-model.workspace = true
omnia-wasi-websocket.workspace = true
omnia-wasi-otel.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tower.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia-test = { workspace = true, features = ["guest"] }
