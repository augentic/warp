[package]
name = "omnia-plugin"
description = "The omnia:plugins/loader capability for the omnia runtime: the loader host, acquisition policies, and plugin stores"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
cap-std.workspace = true
futures.workspace = true
omnia-core.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
wasm-pkg-client.workspace = true
wasmtime = { workspace = true, features = ["runtime"] }

[dev-dependencies]
omnia = { workspace = true, features = ["plugin", "link"] }
omnia-test = { workspace = true, features = ["host"] }
omnia-wasi-otel.workspace = true
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
