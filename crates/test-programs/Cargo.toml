[package]
name = "test-programs"
description = "Guest scenario programs driven by the e2e test suites, and their compiled artifacts"
publish = false
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true
autoexamples = false

# The guest side: `build.rs` (through `omnia_test::build`) compiles every
# `programs/<capability>/<scenario>.rs` as an `[[example]]` cdylib for
# `wasm32-wasip2`. The native side has no dependencies: it is the generated
# artifact paths alone.
[target.'cfg(target_arch = "wasm32")'.dependencies]
clap.workspace = true
futures.workspace = true
omnia-guest = { workspace = true, features = ["command", "schema"] }
omnia-wasi-model.workspace = true
omnia-wasi-otel.workspace = true
serde.workspace = true
tracing.workspace = true
wasip3.workspace = true
wit-bindgen.workspace = true

[build-dependencies]
omnia-test = { workspace = true, features = ["build"] }

# Generated by build.rs from programs/<group>/<scenario>.rs.

[[example]]
name = "command_exit_map"
path = "programs/command/exit_map.rs"
crate-type = ["cdylib"]

[[example]]
name = "config_seeded"
path = "programs/config/seeded.rs"
crate-type = ["cdylib"]

