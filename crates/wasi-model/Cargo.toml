[package]
name = "omnia-wasi-model"
description = "WASI model completion interface (the omnia:model boundary) for the Omnia runtime"
readme = "README.md"
authors.workspace = true
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

# dependencies shared across host and guest
[dependencies]
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true

# host dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cap-std.workspace = true
futures.workspace = true
omnia-core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
# `component-model-async` for `StreamReader`/`FutureReader`
# belongs on the direct dependency.
wasmtime = { workspace = true, features = ["component-model-async"] }
wasmtime-wasi.workspace = true

# guest dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip3.workspace = true
wit-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
omnia.workspace = true
omnia-test = { workspace = true, features = ["host"] }
test-programs.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
