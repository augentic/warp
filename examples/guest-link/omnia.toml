# Host-mediated dynamic linking.
#
# Two guests share one runtime. `router` imports `omnia:link/echo`; the host
# does not satisfy that import natively, so it is named in the deployment's
# `[link] interfaces` and the runtime core polyfills it onto the shared linker.
# At startup the host wires the serve side of every dispatched interface, so
# calling the import dispatches over the in-process wRPC carrier to
# `responder`, which exports it.
#
# The runtime core stays domain-agnostic: `[link] interfaces` and the selector
# see only the opaque interface string `omnia:link/echo` and opaque guest ids.
#
# Build the guests first (see README.md), then run (this path is the runtime's
# compiled-in default, so `--config` is optional):
#
#   cargo run --example guest-link -- run

# The host-mediated interfaces this deployment mediates. The runtime core
# wires each named interface onto the shared linker and dispatches calls to
# whichever guest exports it (here, `responder`).
[link]
interfaces = ["omnia:link/echo"]

[[guest]]
id = "responder"
source.path = "../../target/wasm32-wasip2/debug/examples/guest_link_responder_wasm.wasm"

[[guest]]
id = "router"
source.path = "../../target/wasm32-wasip2/debug/examples/guest_link_router_wasm.wasm"

# In-process is the default transport; named here for clarity. UDS / NATS / QUIC
# slot in behind the same seam in Phase 3 with no guest or dispatch change.
[transport]
default = "in-process"
